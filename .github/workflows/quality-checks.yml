name: Quality checks

on:
  push:
    branches:
      - fix/complete-quality-audit
  pull_request:
    branches:
      - main

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run repository quality checks
        run: python tests/quality_checks.py
